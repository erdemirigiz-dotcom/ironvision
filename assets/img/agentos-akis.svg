<path d="M500 196 C540 196 540 172 572 172"/>
<path d="M500 212 C540 212 540 260 572 260"/>
<path d="M500 228 C540 228 540 348 572 348"/>
<path d="M776 84 C812 84 812 170 848 196"/>
<path d="M776 172 C812 172 812 186 848 202"/>
<path d="M776 260 C812 260 812 226 848 212"/>
