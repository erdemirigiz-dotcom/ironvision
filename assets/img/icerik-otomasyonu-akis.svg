.iot{fill:#f2f4f6;font-family:'Space Grotesk',system-ui,sans-serif;font-size:17px;font-weight:600}
.iol{fill:#6f7a8c;font-family:'Space Grotesk',system-ui,sans-serif;font-size:11px;letter-spacing:.14em;text-transform:uppercase}
</style>
</defs>
<rect x="0" y="0" width="980" height="200" fill="none"/>
