<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 200" role="img" aria-label="İçerik Otomasyonu akış şeması: konu, senaryo, ses, video, yayın">
<defs>
<linearGradient id="ioG1" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0a53d3" stop-opacity=".22"/><stop offset="1" stop-color="#0a53d3" stop-opacity=".04"/></linearGradient>
<marker id="ioOk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 z" fill="#5b7fb8"/></marker>
<style>
