  <path d="M0 470 L180 360 L340 430 L520 320 L700 410 L900 300 L1080 400 L1280 340 L1280 720 L0 720 Z" fill="url(#ridgeFar)" opacity="0.55"/>
  <path d="M0 560 L230 430 L430 520 L640 400 L860 510 L1080 420 L1280 500 L1280 720 L0 720 Z" fill="url(#ridgeNear)"/>
  <path d="M0 560 L230 430 L300 475 L360 445 L430 520 L500 480 L560 505 L640 400 L720 452 L780 430 L860 510 L960 460 L1080 420 L1180 462 L1280 500" fill="none" stroke="#9CB2C2" stroke-width="1.4" opacity="0.5"/>
  <g opacity="0.5" fill="#ffffff">
    <circle cx="180" cy="150" r="1.6"/><circle cx="420" cy="90" r="1.2"/><circle cx="640" cy="140" r="1.5"/>
    <circle cx="300" cy="210" r="1"/><circle cx="1120" cy="120" r="1.3"/><circle cx="760" cy="70" r="1"/>
