<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iron Vision – Kripto Kar ve Vergi Hesaplayıcı</title>
  <style>
    :root {
      --bg: #0a0e12;
      --card: #151a1f;
      --accent: #00ff66;
      --danger: #e74c3c;
      --text: #e0e6ed;
      --muted: #a0a8b0;
    }
    body { font-family: 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); margin: 0; min-height: 100vh; display: flex; }
    .sidebar { flex: 0 0 260px; background: var(--card); border-right: 1px solid #2d3748; display: flex; flex-direction: column; align-items: center; justify-content: center; }
    .main { flex: 1; padding: 2rem; }
    .btn { background: var(--accent); color: #000; padding: 14px; border: none; border-radius: 8px; cursor: pointer; width: 100%; font-weight: bold; }
    .lang-menu { display: none; position: absolute; background: #2d3748; list-style: none; padding: 10px; border-radius: 8px; }
    .lang-menu.show { display: block; }
    canvas { width: 200px; height: 200px; }
  </style>
</head>
<body>
  <div class="sidebar">
    <h2 style="color:var(--accent);">IRON VISION</h2>
    <canvas id="sphereCanvas"></canvas>
  </div>
  <div class="main">
    <div class="lang">
      <button id="langBtn" class="btn" style="width:auto; padding:5px 15px;">🌐 Dil / Language</button>
      <ul class="lang-menu" id="langMenu">
        <li data-lang="en" style="cursor:pointer; padding:5px;">🇺🇸 English</li>
        <li data-lang="tr" style="cursor:pointer; padding:5px;">🇹🇷 Türkçe</li>
      </ul>
    </div>
    <form id="calcForm" style="margin-top:20px;">
      <input type="number" id="investAmount" placeholder="Yatırım Miktarı" style="padding:10px; width:100%;">
      <input type="number" id="buyPrice" placeholder="Alış Fiyatı (USD)" style="padding:10px; width:100%; margin-top:10px;">
      <input type="number" id="sellPrice" placeholder="Satış Fiyatı (USD)" style="padding:10px; width:100%; margin-top:10px;">
      <button type="button" class="btn" onclick="calculateProfit()" style="margin-top:15px;">Hesapla</button>
    </form>
    <div id="netReturn" style="font-size:2rem; color:var(--accent); margin-top:20px;">+0.00 $</div>
  </div>

  <script>
    const $ = id => document.getElementById(id);
    
    // Dil Menüsü
    $('langBtn').onclick = () => $('langMenu').classList.toggle('show');

    // Hesaplama
    function calculateProfit() {
      const amt = parseFloat($('investAmount').value) || 0;
      const buy = parseFloat($('buyPrice').value) || 0;
      const sell = parseFloat($('sellPrice').value) || 0;
      if(amt && buy && sell) {
        const net = (amt / buy) * sell - amt;
        $('netReturn').innerText = (net >= 0 ? '+' : '') + net.toFixed(2) + " $";
      }
    }

    // Küre Animasyonu (Düzeltildi)
    const canvas = $('sphereCanvas');
    const ctx = canvas.getContext('2d');
    function draw() {
      ctx.clearRect(0,0,200,200);
      ctx.beginPath(); ctx.arc(100,100,50,0,Math.PI*2);
      ctx.fillStyle = '#00ff66'; ctx.fill();
      requestAnimationFrame(draw);
    }
    draw();
  </script>
</body>
</html>
